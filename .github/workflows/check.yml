name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:prepare
      - run: npm run check
      - run: npm run test:integration
      - run: npm run audit
      - run: npm run pack
      - run: npm run test:delivery -- artifacts/ds-bot-mobile-bridge-0.0.6.tgz
      - run: npm run audit
